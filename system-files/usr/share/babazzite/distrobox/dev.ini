# Development container, created with `ujust devbox`.
# Toolchains and -devel packages live here instead of the OS image, so the image
# stays a desktop OS and the toolchains move independently of bootc updates.
# Re-run `ujust devbox` after editing to recreate the container.
[dev]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
init=false
replace=true
start_now=true
# classic dev tools
additional_packages="gcc gcc-c++ gdb make cmake autoconf automake libtool pkgconf-pkg-config patch git-core openssh-clients"
# Rust toolchain (glimpse)
additional_packages="rust cargo"
# bevy
additional_packages="wayland-devel alsa-lib-devel libudev-devel"
# erlang
additional_packages="ncurses-devel"
# homepod
additional_packages="onnxruntime-devel llama-cpp"
# anno
additional_packages="webkit2gtk4.1-devel"
