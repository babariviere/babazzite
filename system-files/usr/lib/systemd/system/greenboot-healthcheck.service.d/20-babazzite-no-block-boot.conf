# Bazzite orders the greenboot health check after network-online.target (its
# DNS check needs the network), and multi-user.target implicitly waits for every
# unit it Wants, so a slow DHCP lease delays the whole desktop (~10s here).
#
# An explicit ordering against multi-user.target suppresses that implicit
# After=, so the check now runs in the background once multi-user.target is
# reached. It still waits for the network, and still gates
# greenboot-success.target / boot-complete.target, so boot counting and rollback
# behave the same.
[Unit]
After=multi-user.target
