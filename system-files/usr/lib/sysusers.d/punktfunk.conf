# The punktfunk RPM creates these groups with groupadd in its %post scriptlet,
# which only writes the IMAGE's /etc/group at build time. On a bootc deploy /etc
# is a three-way merge and /etc/group is locally modified (real user accounts
# live there), so ostree keeps the local copy and the groups never appear on the
# running system. systemd-sysusers runs on every boot and does create them.
#
# GIDs are pinned to what the RPM's groupadd --system picked inside the image, so
# a box that somehow got the scriptlet version keeps the same numbers.
#
# punktfunk        - usbip nodes for the virtual Steam Deck pad, and the group
#                    pf-dm-helper's polkit action authorizes on (stopping the
#                    display manager for a managed gamescope session). Join it
#                    manually: sudo usermod -aG punktfunk $USER
# punktfunk-update - opt-in group for web-console-triggered updates; stays empty.
g punktfunk 950
g punktfunk-update 951
