# Swap on this image is zram only (no disk swap), so swapping out cold anonymous
# pages is cheaper than evicting page cache. The tuned profile sets
# vm.swappiness=10, which suits disk swap. tuned's reapply_sysctl=1 only
# reapplies /etc/sysctl.d (not /usr/lib/sysctl.d), so this file must live in
# /etc to win. Values follow Fedora/Pop!_OS zram guidance.
vm.swappiness = 180
# zram has no seek cost, so swap readahead only wastes decompression work.
vm.page-cluster = 0
