---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Derivation of Bazzite to use Niri and tweak it to my liking"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      # The runner runs out of disk space copying image layers without this.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@main

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: true

      # Chunk the image the same way Bazzite does: rpm-ostree groups the
      # rootfs into ~127 content-addressed layers annotated with the packages
      # they contain. Unchanged packages land in identical layers across
      # builds, so GHCR skips re-uploading them.
      - name: Chunk image
        id: chunk
        env:
          SRC: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          LABELS: ${{ steps.metadata.outputs.labels }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          # /run and /tmp must be empty in a bootc image; the build leaves junk there.
          buildah unshare bash -euo pipefail -c '
            container=$(buildah from "$SRC")
            mnt=$(buildah mount "$container")
            rm -rf "$mnt"/run/.* "$mnt"/run/* "$mnt"/tmp/.* "$mnt"/tmp/* || true
            buildah umount "$container"
            buildah commit --identity-label=false --rm "$container" "$SRC"
          '

          CHUNK_DIR="$(mktemp -d "${RUNNER_TEMP}/chunk-XXXXXX")"

          # rpm-ostree strips labels, so reapply the metadata ones here.
          label_args=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              label_args+=(--label "$line")
            fi
          done <<< "${LABELS}"

          podman run --rm \
            --pull=never \
            --privileged \
            --mount=type=image,src="${SRC}",target=/rpm-ostree \
            --volume "${CHUNK_DIR}:/run/out:Z" \
            --entrypoint /usr/bin/rpm-ostree \
            "${SRC}" \
            compose build-chunked-oci \
            --bootc --max-layers 127 --format-version 2 \
            "${label_args[@]}" \
            --rootfs /rpm-ostree --output oci-archive:/run/out/chunked.oci

          # Free the unchunked copy before pulling the chunked one back in;
          # the runner does not have room for both.
          podman images --format '{{.ID}}' "localhost/${IMAGE_NAME}" | sort -u | xargs -r podman rmi -f

          CHUNKED=$(podman pull oci-archive:"${CHUNK_DIR}/chunked.oci")
          rm -rf "${CHUNK_DIR}"

          for tag in ${TAGS}; do
            podman tag "${CHUNKED}" "${IMAGE_NAME}:${tag}"
          done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          # Write to the Docker config: podman and skopeo read it, and cosign
          # only reads it (it ignores $XDG_RUNTIME_DIR/containers/auth.json).
          mkdir -p "${HOME}/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin \
            --authfile "${HOME}/.docker/config.json"

      # Push one tag, then alias the rest server-side with skopeo: the registry
      # mounts the existing blobs instead of us re-uploading the image per tag.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 30
          command: |
            set -euo pipefail

            IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
            read -r primary _ <<< "${TAGS}"

            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${primary}" "docker://${IMAGE_FULL}:${primary}"

            digest="$(< /tmp/digestfile)"
            if [[ -z "$digest" ]]; then
              echo "push reported success but wrote no digest" >&2
              exit 1
            fi

            for tag in ${TAGS}; do
              [[ "$tag" == "$primary" ]] && continue
              skopeo copy "docker://${IMAGE_FULL}@${digest}" "docker://${IMAGE_FULL}:${tag}"
            done

            echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      # Signing the digest once covers every tag that points at it.
      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
